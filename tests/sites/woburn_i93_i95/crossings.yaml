# AC-H2 hand-labeled crossing list for woburn_i93_i95 (I-93 / I-95 cloverleaf, plus
# Washington Street over I-95 at the west edge of the AOI).
#
# status: draft, needs human review. Drafted 2026-11-22 from the pinned fixture
# (lidar_sha256 16245328..., vector_sha256 7aaa5a26...), not from a site visit or
# plans. Crossings are every plan intersection, without a shared node, between in-scope
# OSM edges (roader.io.in_scope) where at least one edge is limited-access. A cloverleaf
# has no ramp-over-ramp crossings; the only grade separations are the I-93 deck over
# I-95 and the Washington Street deck over I-95.
#
# Method (unit frame, heights NAVD88 assumed, meters): upper surface = median z of
# class 17 returns within 1.5 m of the crossing point. Lower surface = median z of
# class 2 returns within 1.5 m of the lower centerline at the first stations on either
# side clear of class 17 (no class 17 within 4 m) plus 3 m, linearly interpolated to the
# crossing. No lidar returns reach the pavement under any deck, so every lower value is
# interpolated: across about 75 m under the skewed I-93 deck, about 31 m under
# Washington Street. dz is upper minus lower (FR-CR-1), to 0.1 m. skew_deg is from
# perpendicular, between the OSM centerlines. I-95 is signed north = east here.
#
# Review checklist: confirm the vertical order; confirm the I-93 deck is one structure
# (or twin superstructures with a closed median joint); decide whether the NE loop's
# merge taper (way 9522025, drawn about 1 m from the I-95 southbound centerline under
# the deck) is a separate crossing or part of I-95 southbound; confirm deck ends.

