# AC-H2 hand-labeled crossing list for wboylston_laurel_i190 (Laurel Street over I-190).
#
# status: draft, needs human review. Drafted 2026-11-22 from the pinned fixture
# (lidar_sha256 02240e07..., vector_sha256 fc4eb5d5...), not from a site visit or
# plans. Method: plan intersections of the OSM centerlines in the unit frame; upper
# surface = median z of returns within 1.5 m of the crossing point (all class 17);
# lower surface = linear interpolation of the median z of returns within 1.5 m of the
# lower centerline at -15 m and +15 m along it (outside the deck shadow). Heights are
# NAVD88 (assumed), meters. dz is upper surface minus lower surface (FR-CR-1), given
# to 0.1 m; AC-A4 compares against the measured value, so treat these as checks on
# order and magnitude only.
#
# Review checklist: confirm the vertical order, confirm one structure spans both
# carriageways (class 17 is continuous along Laurel Street between the two crossings,
# about 64 m apart along the bridge), and look for a median pier.

site_id: wboylston_laurel_i190
status: draft, needs human review
crossings:
  - id: laurel_over_i190_sb
    upper: {osm_way: 183371679, name: Laurel Street, highway: secondary}
    lower: {osm_way: 9364739, name: I-190 southbound, highway: motorway}
    lonlat: [-71.816853, 42.388901]
    upper_z_m: 181.2
    lower_z_m: 174.0
    dz_m: 7.2
    skew_deg: 32  # from perpendicular, between the OSM centerlines
    tags: {upper_layer: "1", upper_bridge: "yes", lower_layer: ""}
    structure: laurel_over_i190
  - id: laurel_over_i190_nb
    upper: {osm_way: 183371679, name: Laurel Street, highway: secondary}
    lower: {osm_way: 398785088, name: I-190 northbound, highway: motorway}
    lonlat: [-71.816097, 42.389058]
    upper_z_m: 180.0
    lower_z_m: 172.7
    dz_m: 7.4
    skew_deg: 32
    tags: {upper_layer: "1", upper_bridge: "yes", lower_layer: ""}
    structure: laurel_over_i190

# AC-A5 structure ends. status: draft, needs human review. NOT ground truth.
#
# Drafted 2026-11-22 from the pinned lidar fixture only (no imagery, no plans, no
# inventory record). Method: returns classified 17 (bridge deck) lying on the
# Laurel Street pavement surface (within the fitted pavement width, within 0.5 m
# of the fitted surface), projected onto the fitted Laurel Street centerline; the
# ends are the 0.5th and 99.5th percentile stations, written as lon/lat points on
# the centerline so they do not depend on model stations. Class 17 is vendor
# evidence (FR-IN-3); the pipeline also uses it when it agrees with the sheet
# break, so AC-A5 against these ends is a consistency check, not an independent
# measurement. The sheet-break estimate (ground 1.5-4 m beyond both pavement
# edges more than 2.5 m below the deck, skew-corrected) is listed as an
# alternative; it runs about 3 m longer at each end, probably over the wingwalls.
# Review checklist: confirm the deck joints (backwalls) from plans, inventory
# (NBI length about 101 m in OSM) or a site visit, and replace these values.
structure_ends:
  status: draft, needs human review
  structures:
    - id: laurel_over_i190
      carries: [183371679]
      over: [9364739, 398785088]
      note: >-
        One deck over both I-190 carriageways. Method: class 17 extent on the carried
        pavement (0.5 / 99.5 percentile stations); the skew-corrected sheet break beside
        the deck is given as an alternative.
      ends:
        - along: 183371679
          start_lonlat: [-71.8171235, 42.3888443]
          end_lonlat: [-71.8158562, 42.3891055]
          length_m: 108.3
          alternative:
            method: sheet break beside the deck, skew-corrected
            start_lonlat: [-71.817157, 42.3888374]
            end_lonlat: [-71.8158264, 42.3891116]
            length_m: 113.7
