# AC-H2 hand-labeled crossing list for dallas_high_five_i635_us75 (I-635 / US 75 High Five
# stack, Dallas TX, plus Coit Road, Churchill Way, Greenville Avenue and the I-635 / US 75
# frontage roads within the AOI).
#
# status: draft, needs human review. Drafted 2026-11-22 from the pinned fixture
# (lidar_sha256 1534bf76..., vector_sha256 772220bb...), not from a site visit or plans.
# Crossings are every plan intersection inside the AOI, without a shared node, between
# in-scope OSM edges (roader.io.in_scope) where at least one edge is limited-access
# (D-037): 251 way pairs, each crossing once. Under D-160 paths (footways, cycleways and
# the like) are in scope only on their own bridges. Every crossing is at least 100 m
# inside the AOI.
#
# Class 17 (bridge deck) is present in this collection: 1,349,328 returns in the AOI.
#
# Method (unit frame, heights NAVD88 assumed, meters; classes 2 and 17 only). Each way is
# traced along its OSM centerline, extended through the least-deflected continuing way
# (under 40 deg) up to 1.5 km each side. Every 2 m the returns within 1.5 m are split
# into height clusters and one surface is tracked through them with a 6 % grade limit,
# so a deck above or below is not taken for the road. At a crossing each way's height is
# interpolated from its tracked stations outside the other way's footprint (half width
# by OSM class plus 4 m); the higher way is the upper. upper_z_m is the upper way's own
# returns at the crossing when they agree with that profile, else the interpolation
# (stack decks above it hide it). lower_z_m is the interpolation, or the lower way's own
# returns under the deck when they exist. `evidence` says which, and the span of the
# lower interpolation. dz is upper minus lower (FR-CR-1), to 0.1 m. skew_deg is from
# perpendicular, between the traced centerlines.
#
# Construction mismatch. The lidar was collected in 2019; OSM is from 2026. Around the
# I-635 / Greenville Avenue interchange (east of lon -96.747) and along the TEXpress
# connector ways 1559139703 and 1559139707, OSM bridges have no deck in the lidar:
# Greenville Avenue is level with I-635 where OSM has it on a bridge over it, and the two
# TEXpress connectors are absent. This looks like TxDOT's LBJ East rebuild of I-635 east
# of US 75 after the collection (not confirmed). Those crossings cannot be drafted from
# this collection and are listed under `unresolved` with the reason, not as crossings.
# The newer TX_2022NorthCentral_1_D25 EPT has no ept.json in the USGS bucket yet.
#
# Review checklist: confirm the vertical order of each crossing, starting with the
# `review` notes and the uppers marked occluded; resolve the `unresolved` entries
# (construction date of the Greenville / TEXpress work, or a newer collection); confirm
# the structure grouping and the deck ends.

