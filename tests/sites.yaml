    description: >-
      I-93 / I-95 (MA 128) full cloverleaf where Woburn, Reading and Stoneham MA meet;
      I-93 crosses over I-95 at about (-71.1189, 42.5022). Four loops, four outer ramps,
      no collector-distributor roads. The AOI is the extent of every ramp of the
      interchange (gores at lon -71.1250 / -71.1105, lat 42.4983 / 42.5065) plus
