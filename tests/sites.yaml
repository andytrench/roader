  - id: seattle_i5_beacon_hill
    class: twin_carriageways_different_elevations
    milestone: catalogue
    description: >-
      I-5 along the west slope of Beacon Hill above Georgetown, Seattle, WA: the
      northbound carriageway runs 4.5 to 20.6 m above the southbound one (lidar, sampled
      every 120 m), 50 to 68 m apart across a wooded, sloping median. Each carriageway
      has its own bridge over Military Road South at the south end, the only grade
      separation of in-scope roads in the AOI; the southbound carriageway also has a
      134 m bridge (OSM way 806572224) with no mapped road under it. Airport Way South
      runs parallel below on the west. The AOI is the stretch where the carriageways sit
      at clearly different elevations: the north edge (lat 47.5430) stops short of the
      ramps at lat 47.545, the south edge (lat 47.5290) is about 140 m south of the
      Military Road South bridges, where the two levels have nearly rejoined.
      Runner-up: I-5 at South 188th Street, SeaTac / Tukwila WA (-122.2770, 47.4275),
      same EPT, carriageways about 55 m apart and 12 m different in elevation.
