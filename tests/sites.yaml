  - id: neworleans_i10_claiborne_viaduct
    class: long_urban_viaduct
    milestone: catalogue
    description: >-
      I-10 Claiborne Avenue Expressway viaduct over North Claiborne Avenue in the Treme
      and 7th Ward, New Orleans, LA: about 1.9 km of twin-deck viaduct (one deck per
      carriageway on shared piers over the Claiborne neutral ground) crossing every street
      of the grid, with the Orleans Avenue / Vieux Carre ramp pair (two hook ramps on
      bridges), the Canal Street ramps at the south-west end and the Esplanade Avenue
      ramp. The lidar holds two continuous class 17 decks through the AOI, one per
      carriageway with its ramps; 139 draft crossings, almost all streets and sidewalks
      under the viaduct. The south-west edge (lon -90.0805, lat
      29.9570) stops north-east of the I-10 / US 90 Business (Pontchartrain Expressway)
      interchange ramps and of the Tulane Avenue crossing; the north-east edge (lon
      -90.0660, lat 29.9715) stops before the St. Bernard Avenue ramps, so every
      structure in the AOI belongs to the viaduct.
      Runner-up: the US 90 Business (Pontchartrain Expressway) viaduct south-west of the
      I-10 junction, same EPT, 10 to 13 pts/m2 with class 17.
    aoi_lonlat: [-90.0805, 29.9570, -90.0660, 29.9715]
    crossing_lonlat: [-90.0735, 29.9640]
    lidar:
