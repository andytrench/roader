    sites: [neworleans_i10_claiborne_viaduct]
  - class: twin_carriageways_different_elevations
    status: assigned
    sites: [seattle_i5_beacon_hill]
  # Interchange catalogue: one site per spec section 1 interchange type beyond the
  # section 9 classes, milestone "catalogue" (not tied to a section 10 milestone yet).
  - class: diamond_interchange
    status: assigned
    sites: [columbus_i71_sr161]
  - class: single_point_urban_interchange
    status: assigned
    sites: [henderson_i215_arroyo_grande]
