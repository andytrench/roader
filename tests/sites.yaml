    description: >-
      Loop 101 (Price Freeway) / Loop 202 (Santan Freeway) directional T, Chandler, AZ:
      Loop 101 ends at Loop 202 and all four movements use flyover or semi-direct ramps,
      no loops, over Price Road and the Santan Village Parkway frontage. The AOI holds
