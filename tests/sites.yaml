    sites: [wright_co_i94_fenning]
  - class: trumpet_interchange
    status: assigned
    sites: [lorain_co_ohtpk_baumhart]
  - class: directional_interchange
    status: assigned
    sites: [chandler_loop101_loop202]
  - class: collector_distributor_braided
    status: assigned
    sites: [bellevue_i405_ne8th_sr520]
  - class: major_river_crossing_truss_or_arch
