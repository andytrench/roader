# Test sites, one or more per spec section 9 test-site class.
#
# Inputs are pinned by sha256 (FR-PL-3, D-008). scripts/fetch_fixtures.py downloads
# them into data/fixtures/<id>/ and writes the hashes back into this file; never edit
# a hash by hand. Point clouds and vector extracts are not committed.
#
# aoi_lonlat is [west, south, east, north] in WGS84 degrees.
# lidar.density_pts_m2 is all returns in the AOI after noise/withheld removal.
#
# A class or site with status: shortlisted has its location and lidar coverage
# confirmed from the EPT metadata and a point count over a sample window, but no
# fixture yet: empty hashes, and fetch_fixtures.py skips it unless named with --site.

classes:
  - class: simple_overpass_rural_freeway
    status: assigned
    sites: [wboylston_laurel_i190]
  - class: cloverleaf_interchange
    status: assigned
    sites: [woburn_i93_i95]
  - class: four_or_five_level_stack
    status: shortlisted
    sites: [dallas_high_five_i635_us75]
  - class: long_urban_viaduct
    status: unassigned
  - class: twin_carriageways_different_elevations
    status: unassigned
  - class: major_river_crossing_truss_or_arch
    status: unassigned
  - class: mountain_cuts_fills_walls
    status: unassigned
  - class: dense_tree_canopy
    status: unassigned
  - class: ql3_or_older_lidar
    status: unassigned
  - class: construction_mismatch
    status: unassigned
  - class: tunnel_portal
    status: unassigned
  - class: wrong_or_missing_vector_tags
    status: unassigned

sites:
  - id: wboylston_laurel_i190
    class: simple_overpass_rural_freeway
    milestone: 1
    description: >-
      Laurel Street (two-lane secondary road, OSM way 183371679, bridge=yes) crossing
      over I-190 (two lanes each way, twin carriageways) in West Boylston, MA. Wooded
      rural setting, about 22 buildings in the AOI, no interchange ramps within 500 m
      of the crossing, no railway, one small stream. One 101 m bridge (OSM) spans both
      carriageways, which sit about 54 m apart across a wide median, skew about 32 deg.
      Deck about 7.2 m (SB) and 7.4 m (NB) above the freeway pavement.
      Runner-up: Sugar Road over I-495, Bolton MA (crossing -71.58143, 42.45018),
      25 pts/m2, class 17 present, three lanes each way, more streams.
    aoi_lonlat: [-71.81975, 42.38636, -71.81245, 42.39176]
    crossing_lonlat: [-71.8161, 42.38906]
    lidar:
      project: MA_CentralEastern_1_2021
      ept: https://s3-us-west-2.amazonaws.com/usgs-lidar-public/MA_CentralEastern_1_2021/ept.json
      year: 2021
      quality_level: QL1
      horizontal_crs: EPSG:3857
      vertical_crs: NAVD88 (assumed; not declared in the EPT/LAS header)
      density_pts_m2: 22.5
      classes_seen: [1, 2, 3, 4, 5, 6, 7, 17, 18]
      class_17_points: 18044
    vectors:
      source: osm
      license: ODbL-1.0
      path: data/fixtures/wboylston_laurel_i190/osm.json
    lidar_path: data/fixtures/wboylston_laurel_i190/lidar.laz
    crossings: tests/sites/wboylston_laurel_i190/crossings.yaml
    lidar_sha256: "02240e071dfa40323b54995f2f4dfd152ef58853a65319818cde60ec5a538352"
    vector_sha256: "fc4eb5d5f9b016e63d2fd6dc73cf0f08595e36ebbbdbf6e025cc1d40f112084c"

  - id: woburn_i93_i95
    class: cloverleaf_interchange
    milestone: 2
    description: >-
      I-93 / I-95 (MA 128) full cloverleaf where Woburn, Reading and Stoneham MA meet;
      I-93 crosses over I-95 at about (-71.1189, 42.5022). Four loops, four outer ramps,
      no collector-distributor roads. The AOI is the extent of every ramp of the
      interchange (gores at lon -71.1250 / -71.1105, lat 42.4983 / 42.5065) plus
      Washington Street over I-95 (about 140 m west of the westernmost gore, part of
      the next interchange), with about 100 m margin. West Street under I-93 (about
      300 m north of the north gore) is outside. The pre-spec pilot AOI
      [-71.150, 42.503, -71.125, 42.517] missed the interchange and is not used.
    aoi_lonlat: [-71.1278, 42.4974, -71.1093, 42.5079]
    crossing_lonlat: [-71.1189, 42.5022]
    lidar:
      project: MA_CentralEastern_1_2021
      ept: https://s3-us-west-2.amazonaws.com/usgs-lidar-public/MA_CentralEastern_1_2021/ept.json
      year: 2021
      quality_level: QL1
      horizontal_crs: EPSG:3857
      vertical_crs: NAVD88 (assumed; not declared in the EPT/LAS header)
      collected: 2021-03-20 to 2021-04-24 (USGS WESM, MA_CentralEastern_2021_B21)
      density_pts_m2: 15.9
      classes_seen: [1, 2, 3, 4, 5, 6, 7, 17, 18]
      class_17_points: 84323
      point_count: 28265339
      laz_bytes: 149027034
      older_vintage: >-
        EPT MA_NE_CMGP_Sandy_Z19_A1_2015 also covers the AOI (WESM
        New_England_CMGP_SANDY_LiDAR, QL2, collected 2013-11-16 to 2014-12-31); not fetched
    vectors:
      source: osm
      license: ODbL-1.0
      path: data/fixtures/woburn_i93_i95/osm.json
    lidar_path: data/fixtures/woburn_i93_i95/lidar.laz
    crossings: tests/sites/woburn_i93_i95/crossings.yaml
    lidar_sha256: "16245328445268f77ddc7709374fd43c51b653ada2d43cfce5dfc9e471eff886"
    vector_sha256: "7aaa5a2626be67728e6836493150edd6ca952b5e68d2f643d6bc208235d4b127"

  - id: dallas_high_five_i635_us75
    class: four_or_five_level_stack
    milestone: 2
    status: shortlisted
    description: >-
      The High Five: I-635 (LBJ Freeway, with TEXpress managed lanes) / US 75 (Central
      Expressway) five-level stack in Dallas, TX. OSM tags direct connectors at layers 3
      to 5 over the two mainlines and the frontage roads. The AOI is the extent of the
      elevated connectors (layer >= 3) of this interchange plus margin; the TEXpress
      connectors running further southeast along I-635 are outside.
      Runner-up: Judge Harry Pregerson Interchange, I-105 / I-110, Los Angeles CA
      (-118.2806, 33.9288), EPT CA_LosAngeles_1_B23 (WESM CA_LosAngeles_B23, QL1,
      collected 2023-01-08 to 2024-01-07), 15.9 pts/m2 over a 300 m window, class 17 present.
    aoi_lonlat: [-96.7740, 32.9180, -96.7550, 32.9300]
    crossing_lonlat: [-96.7655, 32.9240]
    lidar:
      project: TX_Pecos_Dallas_B3_2018
      ept: https://s3-us-west-2.amazonaws.com/usgs-lidar-public/TX_Pecos_Dallas_B3_2018/ept.json
      year: 2019
      quality_level: QL2
      horizontal_crs: EPSG:3857
      vertical_crs: NAVD88 (assumed; not declared in the EPT metadata)
      collected: 2019-03-16 to 2019-07-12 (USGS WESM, TX_Pecos_Dallas_2018_D19)
      ept_points: 42113131074
      density_pts_m2: 8.9  # 300 m x 300 m window at crossing_lonlat, classes 7 and 18 removed
      classes_seen: [1, 2, 7, 17, 18]  # same window
      class_17_points: 216548  # same window
    vectors:
      source: osm
      license: ODbL-1.0
      path: data/fixtures/dallas_high_five_i635_us75/osm.json
    lidar_path: data/fixtures/dallas_high_five_i635_us75/lidar.laz
    lidar_sha256: ""
    vector_sha256: ""
