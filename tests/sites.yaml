  - id: dallas_high_five_i635_us75
    class: four_or_five_level_stack
    milestone: 2
    description: >-
      The High Five: I-635 (LBJ Freeway, with TEXpress managed lanes) / US 75 (Central
      Expressway) five-level stack in Dallas, TX. OSM tags direct connectors at layers 3
      to 5 over the two mainlines and the frontage roads. The AOI holds both gores of
      each of the eight general-purpose direct connectors between I-635 and US 75
      (outermost gores at lon -96.7756 / -96.7439, lat 32.9167 / 32.9301) and every
      elevated level, with at least 90 m margin. The east gores sit inside the I-635 /
      Greenville Avenue interchange, so the east and south edges are pushed out until
      every plan crossing there is at least 100 m inside. Outside: the far ends of the
      TEXpress connectors (on the TEXpress lanes about -96.739 and -96.778, and the
      US 75 southbound collector north of lat 32.9313, where the layer-5 connector
      diverges), Midpark Road over US 75 (lat 32.9346) and Coit Road over I-635
      (lon -96.781). The shortlist AOI [-96.7740, 32.9180, -96.7550, 32.9300] was the
      extent of layers >= 3 only and missed every connector gore.
      Runner-up: Judge Harry Pregerson Interchange, I-105 / I-110, Los Angeles CA
      (-118.2806, 33.9288), EPT CA_LosAngeles_1_B23 (WESM CA_LosAngeles_B23, QL1,
      collected 2023-01-08 to 2024-01-07), 15.9 pts/m2 over a 300 m window, class 17 present.
