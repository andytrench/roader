    description: >-
      I-405 between NE 8th Street and SR 520, Bellevue, WA: collector-distributor roads
      on both sides of I-405 between the NE 8th Street interchange and the I-405 / SR 520
      interchange, with the braided ramps of WSDOT's NE 8th Street to SR 520 braided-ramps
