# Grades and vertical curves (spec section 8).
# "grade" is |dz/ds|; high is the class maximum. K is curve length per percent of
# algebraic grade change (m per %), low is the minimum.
family = "grades_and_vertical_curves"

[[rule]]
id = "grade"
road_class = "motorway"
typical = 0.02
low = 0.0
high = 0.06
unit = "ratio"
origin = "placeholder: indicative scale from ROADWAY_MODEL_SPEC.md section 8"
placeholder = true

[[rule]]
id = "grade"
road_class = "motorway_link"
typical = 0.03
low = 0.0
high = 0.08
unit = "ratio"
origin = "placeholder: engineering judgement, unverified"
placeholder = true

